<header class="nav" [class.is-open]="menuOpen()">
  <div class="nav__inner">
    <a class="brand" routerLink="/" aria-label="Telesuk Solutions — home" (click)="closeMenu()">
      <img class="brand__logo" src="img/telesuklogo.svg" alt="" width="40" height="33" />
      <span class="brand__word">Telesuk <span class="brand__tech">Solutions</span></span>
    </a>

    <nav id="primary-navigation" class="nav__links" aria-label="Primary">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Home
      </a>
      <a routerLink="/" fragment="about" (click)="closeMenu()">About</a>
      <a routerLink="/" fragment="work" (click)="closeMenu()">Work</a>
      <a routerLink="/team" routerLinkActive="is-active" (click)="closeMenu()">Team</a>
    </nav>

    <a class="btn btn--primary nav__cta" href="mailto:nile.tech.africa.development@gmail.com">
      Start a project
    </a>

    <button
      class="nav__toggle"
      type="button"
      [attr.aria-label]="menuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="nav__bar"></span>
      <span class="nav__bar"></span>
      <span class="nav__bar"></span>
    </button>
  </div>

  <button
    class="nav__scrim"
    type="button"
    tabindex="-1"
    aria-hidden="true"
    (click)="closeMenu()"
  ></button>
</header>
