<header class="nav">

    <a class="brand" routerLink="/" aria-label="Nile Tech Solutions — home">
      <svg class="brand__glyph" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="navGrad" x1="0" y1="0" x2="1" y2="0.4">
            <stop offset="0" stop-color="#7c5cff" />
            <stop offset="1" stop-color="#21d4c4" />
          </linearGradient>
        </defs>
        <path
          d="M4 20 L12 20 L16 9 L21 25 L27 12"
          fill="none"
          stroke="url(#navGrad)"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="brand__word">Nile <span class="brand__tech">Tech</span> Solutions</span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>
      <a routerLink="/team" routerLinkActive="is-active">Team</a>
    </nav>

    <a class="btn btn--primary nav__cta" href="mailto:nile.tech.africa.development@gmail.com">
      Start a project
    </a>
  </div>
</header>
