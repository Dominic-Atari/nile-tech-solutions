<div class="civic-dashboard" [class.is-menu-open]="menuOpen()">
  <aside class="civic-sidebar" [class.is-open]="menuOpen()">
    <a class="civic-sidebar__brand" routerLink="/public-portal" (click)="closeMenu()">
      <img src="img/telesuklogo.svg" alt="" width="38" height="32" />
      <span>
        <strong>Telesuk Civic</strong>
        <small>Public service platform</small>
      </span>
    </a>

    <div class="civic-sidebar__caption">Workspace</div>

    <nav class="civic-sidebar__nav" aria-label="Civic platform">
      <a
        routerLink="/public-portal"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        <span class="civic-nav-icon civic-nav-icon--grid" aria-hidden="true"></span>
        <span>Public portal</span>
      </a>
      <a routerLink="/citizen" routerLinkActive="is-active" (click)="closeMenu()">
        <span class="civic-nav-icon civic-nav-icon--person" aria-hidden="true"></span>
        <span>Citizen services</span>
      </a>
      <a routerLink="/poll-station" routerLinkActive="is-active" (click)="closeMenu()">
        <span class="civic-nav-icon civic-nav-icon--scan" aria-hidden="true"></span>
        <span>Poll station</span>
      </a>
      <a routerLink="/nec-command" routerLinkActive="is-active" (click)="closeMenu()">
        <span class="civic-nav-icon civic-nav-icon--command" aria-hidden="true"></span>
        <span>NEC command</span>
      </a>
    </nav>

    <div class="civic-sidebar__bottom">
      <div class="civic-sidebar__status"><span></span> System healthy</div>
      <small>Demo environment · v1.0</small>
    </div>
  </aside>

  <button
    class="civic-scrim"
    type="button"
    tabindex="-1"
    aria-hidden="true"
    (click)="closeMenu()"
  ></button>

  <section class="civic-content">
    <header class="civic-topbar">
      <button
        class="civic-menu-toggle"
        type="button"
        [attr.aria-label]="menuOpen() ? 'Close dashboard menu' : 'Open dashboard menu'"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span></span><span></span><span></span>
      </button>

      <div class="civic-topbar__heading">
        <span>{{ pageContext }}</span>
        <strong>{{ pageTitle }}</strong>
      </div>

      <div class="civic-topbar__meta">
        <span class="civic-live"><i></i> Live workspace</span>
        <span class="civic-topbar__date">08 Aug 2026 · 14:32 CAT</span>
        <span class="civic-user" aria-label="Signed in user">TS</span>
      </div>
    </header>

    <div class="civic-main">
      <ng-content></ng-content>
    </div>
  </section>
</div>
